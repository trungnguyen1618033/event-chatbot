[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | venv
  | chroma_data
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "tests"]
skip = ["venv", ".venv", "chroma_data"]
